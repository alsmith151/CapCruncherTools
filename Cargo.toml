[package]
name = "capcruncher_tools"
version = "0.1.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ahash = "0.8"
anyhow = "1"
bio = "3.0.0"
crossbeam = "0.8"
ctrlc = "3"
fastq = "0.6.0"
hashbrown = { version = "0.17.0", features = ["rayon"] }
indicatif = { version = "0.18", features = ["rayon"] }
itertools = "0.14.0"
log = "0.4"
niffler = "3.0.0"
noodles = { version = "0.20.0", features = ["fasta"] }
polars = { version = "0.53", default-features = false, features = ["dtype-categorical"] }
pyo3 = { version = "=0.27.0", features = ["abi3-py312", "serde", "extension-module", "hashbrown"] }
pyo3-log = "0.13"
pyo3-polars = "=0.26.0"
pythonize = "=0.27.0"
rand = "0.8"
rayon = "1"
serde = { version = "1.*", features = ["derive"] }
tempfile = "3"
twox-hash = "1.6"


[lib]
# The name of the native library. This is the name which will be used in Python to import the
# library (i.e. `import string_sum`). If you change this, you must also change the name of the
# `#[pymodule]` in `src/lib.rs`.
name = "capcruncher_tools"

# "cdylib" is necessary to produce a shared library for Python to import from.
#
# Downstream Rust code (including code in `bin/`, `examples/`, and `tests/`) will not be able
# to `use string_sum;` unless the "rlib" or "lib" crate type is also included, e.g.:
# crate-type = ["cdylib", "rlib"]
crate-type = ["cdylib"]
