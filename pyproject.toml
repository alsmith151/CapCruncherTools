[project]
authors = [{ name = "asmith" }, { email = "alastair.smith@ndcls.ox.ac.uk" }]
name = "capcruncher-tools"
description = "Extra utilities to enhance CapCruncher"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dynamic = ["version"]
dependencies = [
    "loguru>=0.7.0,<0.8.0",
    "pandas>=2.1.0,<3.0.0",
    "polars>=1.6.0,<2.0.0",
]


[build-system]
build-backend = "maturin"
requires = ["maturin==1.13.1"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
profile = "release"
compatibility = "linux"

[package.metadata.maturin]
name = "capcruncher_tools.capcruncher_tools_rs"


[dependency-groups]
dev = [
    "maturin==1.13.1",
    "pytest==9.0.3",
    "ruff==0.15.11",
]


[project.urls]
repository = "https://github.com/alsmith151/CapCruncherTools"
